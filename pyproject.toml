[project]
name = "local-ai-agent-starter"
version = "0.1.0"
description = "業務AIエージェントを MCP + RAG評価 + 監視つきで、ローカルLLM(Ollama)で本番運用する最小スターター"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=0.2.50,<0.3",
    "langchain>=0.3.0,<0.4",
    "langchain-core>=0.3.0,<0.4",
    "langchain-community>=0.3.0,<0.4",
    "langchain-ollama>=0.2.0,<0.3",
    "langchain-text-splitters>=0.3.0,<0.4",
    "langchain-mcp-adapters>=0.1.0,<0.2",
    "mcp>=1.2.0",
    "ragas>=0.2.10,<0.3",
    "datasets>=2.0.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# プロバイダを差し替える場合のみ
openai = ["langchain-openai>=0.2.0"]
gemini = ["langchain-google-genai>=2.0.0"]
observability = ["langfuse>=2.50.0"]

[tool.uv]
# uv が管理する仮想環境で実行する
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
